services:
  mysql:
    image: mysql:8.0
    container_name: realcrypto-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root1234}
      MYSQL_DATABASE: realcrypto
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: realcrypto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
