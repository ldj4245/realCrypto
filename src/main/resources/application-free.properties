spring.application.name=realcrypto
server.port=${PORT:8080}

# 무료 클라우드 배포 프로필 (SPRING_PROFILES_ACTIVE=free)
# 별도 유료 DB나 Redis 설정 없이도 즉시 기동되며, 외부 무료 MySQL(TiDB/Aiven) 연동 시 DB_URL 환경변수로 덮어쓸 수 있습니다.
spring.datasource.url=${DB_URL:jdbc:h2:mem:realcrypto;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

upbit.api.url=https://api.upbit.com/v1/ticker
binance.api.url=https://api.binance.com/api/v3/ticker/24hr
bithumb.api.url=https://api.bithumb.com/public/ticker/ALL_KRW

# 무료 컨테이너 단일 인스턴스 배포 시 인메모리 캐시 기본 사용 (외부 Redis 사용 시 REDIS_ENABLED=true 지정)
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
