spring.application.name=realcrypto
server.port=${PORT:8080}

# MySQL DB 설정 (로컬 기본값: Docker realcrypto-mysql 연동 / 클라우드 배포 시 환경변수 주입 가능)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/realcrypto?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1234}

# JPA 및 하이버네이트 설정
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 거래소 API 주소 설정
upbit.api.url=https://api.upbit.com/v1/ticker
binance.api.url=https://api.binance.com/api/v3/ticker/24hr
bithumb.api.url=https://api.bithumb.com/public/ticker/ALL_KRW

# Redis 설정 (로컬 기본값: Docker realcrypto-redis 연동 / 미연결 시 인메모리 서킷브레이커 폴백)
app.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms